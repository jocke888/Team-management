<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teamverktyget Cloud</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div id="loginOverlay" class="fullscreen-overlay">
    <div class="modal-card">
        <h2>Logga in</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Ange teamets lösenord.</p>
        <div style="display:flex; flex-direction:column; gap:12px; margin-top: 20px;">
            <input type="email" id="loginEmail" placeholder="E-post">
            <input type="password" id="loginPassword" placeholder="Lösenord">
            <button id="loginBtn">Logga in</button>
            <p id="loginError" style="color: #dc2626; display: none;">Fel inloggning.</p>
        </div>
    </div>
</div>

<div id="appContainer" style="display: none; width: 100%;">
    <header>
        <div class="control-group">
            <button class="secondary" id="snapshotBtn">Ögonblicksbilder & Arkiv</button>
        </div>
        <div class="control-group">
            <button class="secondary" id="sortTeamsBtn">Sortera Team</button>
            <button class="secondary" id="logoutBtn">Logga ut</button>
        </div>
    </header>

    <div id="manualInput">
        <div style="grid-column: 1 / -1; display:flex; align-items:center; gap:8px; margin-bottom:8px;">
            <h3 style="margin:0; font-size:16px;">Lägg till person</h3>
        </div>
        
        <div>
            <label style="display:block; font-size:12px; margin-bottom:4px; color:var(--text-muted)">Namn</label>
            <input id="manualName" placeholder="T.ex. Anna" type="text" style="width:100%"/>
        </div>
        
        <div>
            <label style="display:block; font-size:12px; margin-bottom:4px; color:var(--text-muted)">Roller</label>
            <div id="roleCheckboxContainer" class="checkbox-group-container">
                </div>
        </div>
        
        <div>
            <label style="display:block; font-size:12px; margin-bottom:4px; color:var(--text-muted)">Typ</label>
            <select id="manualType" style="width:100%">
                <option value="anställd">Anställd</option>
                <option value="konsult">Konsult</option>
            </select>
        </div>
        
        <div>
            <label style="display:block; font-size:12px; margin-bottom:4px; color:var(--text-muted)">Placering</label>
            <select id="manualTeam" style="width:100%"></select>
        </div>
        
        <button id="addBtn" style="height:42px;">Lägg till</button>
    </div>

    

    <div class="app-layout">
        <main>
            <div class="team-container" id="teams"></div>
        </main>

        <aside id="legend">
            <div style="font-weight: 700; font-size: 18px; margin-bottom: 4px;">Översikt</div>
            <div id="legendTotal" style="color: var(--text-muted); font-size: 14px; margin-bottom: 16px;">Totalt: 0 personer</div>
            
            <div class="legend-section">
                <h4>Filter: Roller</h4>
                <div id="roleFilters"></div>
                <button class="secondary" style="width:100%; margin-top:8px;" id="clearRoleFilter">Nollställ Roller</button>
            </div>

            <div class="legend-section">
                <h4>Filter: Team</h4>
                <div id="teamFilters"></div>
                <button class="secondary" style="width:100%; margin-top:8px;" id="clearTeamFilter">Nollställ Team</button>
            </div>
        </aside>
    </div>
</div>

<div id="snapshotsOverlay" class="fullscreen-overlay" style="display:none;">
    <div class="modal-card" style="max-width: 500px;">
        <div style="display:flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px;">
            <h2 style="margin:0">Arkiv</h2>
            <button class="icon-btn" id="closeSnapshotsBtn">✖</button>
        </div>
        <div style="display:flex; gap: 8px; margin-bottom: 24px;">
            <input type="text" id="newSnapshotName" placeholder="Namnge ny snapshot..." style="flex:1;">
            <button id="saveSnapshotBtn">Spara Snapshot</button>
        </div>
        <div id="snapshotList" style="max-height: 200px; overflow-y: auto; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 8px; padding: 10px;"></div>
        <div style="border-top: 1px solid var(--border); padding-top: 16px; display:flex; gap:8px;">
            <button class="secondary" id="exportCsvBtn" style="flex:1">Exportera CSV</button>
            <button class="secondary" id="importCsvBtn" style="flex:1">Importera CSV</button>
            <input type="file" id="csvFileInput" accept=".csv" style="display:none">
        </div>
    </div>
</div>

<div id="customModalOverlay" class="fullscreen-overlay" style="display:none;">
    <div class="modal-card" style="text-align: center;">
        <p id="modalMessage"></p>
        <div style="display:flex; gap:12px; justify-content:center; margin-top:20px;">
            <button class="secondary" id="modalCancelBtn">Avbryt</button>
            <button class="danger" id="modalConfirmBtn">Bekräfta</button>
        </div>
    </div>
</div>

<div id="editMemberOverlay" class="fullscreen-overlay" style="display:none;">
    <div class="modal-card">
        <h3>Redigera teammedlem</h3>
        <div style="display:flex; flex-direction:column; gap:12px; text-align: left;">
            <div>
                <label>Namn</label>
                <input id="editName" type="text" style="width:100%">
            </div>
            <div>
                <label>Roller</label>
                <div id="editRoleContainer" class="checkbox-group-container"></div>
            </div>
            <div>
                <label>Typ</label>
                <select id="editType" style="width:100%">
                    <option value="anställd">Anställd</option>
                    <option value="konsult">Konsult</option>
                </select>
            </div>
        </div>
        <div style="display:flex; gap:12px; justify-content:center; margin-top:20px;">
            <button class="secondary" id="editCancelBtn">Avbryt</button>
            <button id="editSaveBtn">Spara ändringar</button>
        </div>
    </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
